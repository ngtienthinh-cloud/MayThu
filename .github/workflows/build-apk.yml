name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'desktop/**'
      - '.github/workflows/build-pc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Giải nén mã nguồn mới (nếu có tệp .zip)
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP" ]; then
            rm -rf /tmp/src && mkdir -p /tmp/src
            unzip -o -q "$ZIP" -d /tmp/src
            SET=$(find /tmp/src -maxdepth 3 -name settings.gradle.kts | head -n 1)
            if [ -z "$SET" ]; then echo "::error::Tệp $ZIP không chứa mã nguồn app"; exit 1; fi
            ROOT=$(dirname "$SET")
            rm -rf "$ROOT/.github"
            cp -a "$ROOT/." .
            git rm -q "$ZIP"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- . ':!.github'
            git commit -q -m "Cập nhật mã nguồn từ source.zip" || true
            git push || true
          fi
          test -f settings.gradle.kts || { echo "::error::Chưa có mã nguồn"; exit 1; }

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Đặt tên tệp
        run: cp app/build/outputs/apk/release/app-release.apk MayThu.apk

      - name: Lưu tệp APK
        uses: actions/upload-artifact@v4
        with:
          name: MayThu-apk
          path: MayThu.apk

      - name: Tạo bản phát hành để tải
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Máy Thu 1.0.${{ github.run_number }}
          files: MayThu.apk
          make_latest: true

      - name: Gửi nhật ký lỗi
        if: failure()
        run: |
          mkdir -p /tmp/log
          if [ -f build.log ]; then tail -n 4000 build.log > /tmp/log/build.log; else echo "Không có build.log" > /tmp/log/build.log; fi
          grep -n -E "^e: |error:|What went wrong|FAILURE|Could not|Unresolved|> Task .*FAILED" -A4 /tmp/log/build.log | head -600 > /tmp/log/errors.txt || true
          cd /tmp/log
          echo "run ${{ github.run_number }}" > run.txt
          git init -q
          git checkout -q -b build-log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Nhật ký build ${{ github.run_number }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-log
